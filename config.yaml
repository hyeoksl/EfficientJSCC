experiment_name: DeepJSCC_dense

seed: 1030
loss_type: MSE
epochs: 500
clip_max_norm: 1.0

model:
  type: DeepJSCC
  SNRdB: 10
  spp: 0.5
  dims: [256,256,256, 256]
  depth: [2,2,4,2]
  resgroup: [1,1,1,1]
  itgroup: [1,1,1,1]

optimizer:
  type: Adam
  learning_rate: 1e-4
  lr_milestone_epoch: []
  lr_gamma: 0.1

dataset:
  train_dataset: /home/hhk/datasets/ImageNet8000   #path to training dataset
  valid_dataset: /home/hhk/datasets/Kodak          #path to valid dataset
  train_batch_size: 8
  valid_batch_size: 16
  num_workers: 16

logging:
  save_dir: 'logs/'
  save_model: True
  save_train_checkpoint_every_steps: 500
  pretrain_ckpt: null
  
